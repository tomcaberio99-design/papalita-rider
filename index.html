let prAuthClient=null,prAuthGeneration=0,prAuthBusy=false,prSigningIn=false,prSigningOut=false,prAuthScheduled=false,prAuthCheckedAt=0,prAuthSubscription=null,prLoginEmail='',prSignOutFailed=false;
function prGetAuthClient(){
 if(prAuthClient?.auth)return prAuthClient;
 if(window.PAPALITA_DB?.auth){prAuthClient=window.PAPALITA_DB;return prAuthClient;}
 const config=window.FOODIE_CONFIG?.supabase;
 if(!config?.url||!config?.anonKey)throw Error('Supabase is not configured. Check the public URL and publishable key in js/config.js.');
 if(!window.supabase?.createClient)throw Error('The Supabase sign-in library could not load. Check your internet connection and refresh.');
 prAuthClient=window.supabase.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 window.PAPALITA_DB=prAuthClient;return prAuthClient;
}

function prAuthMessage(error){
 if(error?.code==='invalid_credentials'||/invalid login credentials/i.test(error?.message||''))return 'Incorrect email or password. Please try again.';
 if(error?.code==='email_not_confirmed')return 'Please confirm your email address before signing in.';
 return error?.message||'Could not sign in. Please try again.';
}
async function prAuthorizeRider(client,user){
 if(!user?.id)throw Error('Your session could not be verified. Please sign in again.');
 const result=await client.from('user_roles').select('user_id,role').eq('user_id',user.id);
 if(result.error)throw Error('Unable to verify rider access: '+result.error.message+' Ask your administrator to check read access to your own user_roles row.');
 const rider=(result.data||[]).some(row=>row.user_id===user.id&&String(row.role||'').trim().toLowerCase()==='rider');
 if(!rider){const error=Error('This account has no rider access. Ask your Papalita administrator to assign the rider role.');error.code='RIDER_ROLE_REQUIRED';throw error;}
 // Profiles provide display details only. A profile field cannot grant rider access.
 let profile={};try{const q=await client.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!q.error&&q.data)profile=q.data;}catch(_){}
 return {id:user.id,name:String(profile.full_name||profile.name||String(user.email||'').split('@')[0]||'Rider'),phone:String(profile.phone||''),vehicle:String(profile.vehicle||profile.vehicle_type||'Delivery rider'),email:String(user.email||''),avatar_url:String(profile.avatar_url||''),auth:true};
}
async function prVerifiedIdentity(client){
 const result=await client.auth.getUser();if(result.error)throw result.error;
 return prAuthorizeRider(client,result.data?.user);
}
async function prRiderCredentials(email,password){
 const client=prGetAuthClient(),result=await client.auth.signInWithPassword({email,password});
 if(result.error)throw result.error;
 if(!result.data?.user||!result.data?.session)throw Error('Sign-in did not return a valid session. Please try again.');
 return prVerifiedIdentity(client);
}

async function prHydrateRider(){

async function prRiderBoot(){
 me=null;prDropLegacyLogin();prAuthLoading();
 try{
  const client=prGetAuthClient();
  const listener=client.auth.onAuthStateChange((event,session)=>{
   // Keep this callback synchronous; all network work is deferred outside it.
   if(event==='SIGNED_OUT'){prLockRider();return;}
   if(event==='SIGNED_IN'||event==='USER_UPDATED'||event==='TOKEN_REFRESHED'){
    if(!prSigningIn&&(!me||me.id!==session?.user?.id||event==='USER_UPDATED'||Date.now()-prAuthCheckedAt>60000))prScheduleAuthCheck();
   }
  });prAuthSubscription=listener?.data?.subscription||null;
  await prHydrateRider();
 }catch(error){me=null;prAuthBusy=false;gate(prAuthMessage(error));}
}

setInterval(() => { if (me && !document.querySelector('.ov') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) draw(); }, 4000); void prRiderBoot();
})();
