<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Papalita Rider</title><meta name="robots" content="noindex"><meta name="theme-color" content="#087F32">
<link rel="manifest" href="./rider.webmanifest?v=4">

<link rel="icon" href="./images/papalita-rider-icon-192.png" type="image/png">

<script src="./js/rider-install.js?v=4"></script>

<!-- PAPALITA RIDER PRESENTATION START -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="papalita-rider-presentation">
:root{--pr-bg:#f8f8f4;--pr-card:#fff;--pr-ink:#203125;--pr-muted:#6d796e;--pr-line:#e1e7de;--pr-soft:#eef4eb;--pr-green:#087f45;--pr-danger:#b84d40}
body.pr-ready{margin:0;background:var(--pr-bg);color:var(--pr-ink);font-family:Inter,'Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;line-height:1.55;--bg:var(--pr-bg);--ink:var(--pr-ink);--mu:var(--pr-muted);--ln:var(--pr-line);--sf:var(--pr-soft);--or:var(--pr-green);--or-s:var(--pr-soft);--or-d:var(--pr-ink);--er:var(--pr-danger)}
.pr-ready *{box-sizing:border-box}
.pr-ready button,.pr-ready input,.pr-ready textarea,.pr-ready select{font-family:inherit}
.pr-ready h1,.pr-ready h2,.pr-ready h3{color:var(--pr-ink)}
.pr-ready .mu{color:var(--pr-muted)}
.pr-icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pr-logo{width:39px;height:43px;border-radius:11px;background:white;object-fit:contain;padding:5px;flex:none}
.pr-icon-button{display:inline-grid;place-items:center;background:var(--pr-card);color:var(--pr-ink);border:1px solid var(--pr-line);border-radius:8px;width:34px;height:34px;cursor:pointer}
.pr-icon-button:hover{background:var(--pr-soft)}
.pr-dialog.ov{position:fixed;inset:0;margin:auto;padding:0;width:min(470px,calc(100% - 28px));max-height:calc(100dvh - 32px);height:auto;background:var(--pr-card);border:1px solid var(--pr-line);border-radius:17px;overflow:auto;color:var(--pr-ink);box-shadow:0 25px 90px #122a2144;z-index:1000}
.pr-dialog::backdrop{background:#11241b88;backdrop-filter:blur(4px)}
.pr-dialog:not([open]){display:none}
.pr-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 22px;background:var(--pr-soft);border-bottom:1px solid var(--pr-line)}
.pr-dialog-head h2{font-size:18px;margin:0;letter-spacing:-.5px}
.pr-dialog-body{padding:22px}
.pr-dialog-body>p{font-size:12px;color:var(--pr-muted);margin:0 0 17px}
.pr-ready .in{border:1px solid var(--pr-line);border-radius:9px;background:var(--pr-card);color:var(--pr-ink);min-height:45px;padding:10px 12px;font-size:16px;width:100%}
.pr-ready .field{margin-bottom:16px}
.pr-ready .field label{font-size:11px;font-weight:650;color:var(--pr-ink);display:block;margin-bottom:6px}
.pr-theme-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr-theme-options button{display:grid;place-items:center;gap:10px;border:1px solid var(--pr-line);border-radius:10px;background:var(--pr-card);color:var(--pr-ink);padding:20px 5px;font-size:12px}
.pr-theme-options button[aria-pressed=true]{outline:2px solid var(--pr-green);outline-offset:1px;background:var(--pr-soft)}
.pr-ready .pr-gate-main{width:100%;max-width:460px!important;padding:0 16px!important;margin:8vh auto!important}
.pr-ready .pr-gate-main #g{margin:0!important;padding:0 25px 24px;border:1px solid var(--pr-line);border-radius:20px;overflow:hidden;box-shadow:0 12px 60px #203a2010}
.pr-gate-brand{margin:0 -25px 24px;padding:23px 25px;background:#1e3525;display:flex;align-items:center;gap:11px;color:white}
.pr-gate-brand strong{display:block;font-size:23px;letter-spacing:-.5px}
.pr-gate-brand small{display:block;color:#c8d5bb;font-size:9px;letter-spacing:1.4px;text-transform:uppercase}
.pr-ready #g h1{font-size:24px!important;letter-spacing:-.5px}
.pr-ready #g>.btn{width:100%;min-height:45px}
.pr-ready #g>.link{display:block;font-size:11px;margin-top:18px;color:var(--pr-green)}
.pr-ready :where(a,button,input,select,textarea,summary):focus-visible{outline:2px solid var(--pr-green);outline-offset:3px}
html[data-pr-theme=dark]{--pr-bg:#121a15;--pr-card:#1c271f;--pr-ink:#edf0e7;--pr-muted:#aebaa9;--pr-line:#354437;--pr-soft:#293b2b;--pr-green:#88bd88;--pr-danger:#f0ada0}
.pr-ready[data-pr-dark=true] .btn.p{color:#142e1c}
.pr-install-login{margin-top:8px}
.pr-rider-installed [data-pr-install]{display:none!important}
.pr-install-native-label,.pr-rider-install-ready .pr-install-help-label{display:none}
.pr-rider-install-ready .pr-install-native-label{display:inline}
.pr-rider-install-pending [data-pr-install]{display:none!important}
.pr-install-pending{display:none}
.pr-rider-install-pending .pr-install-pending{display:block;margin-top:8px;color:var(--pr-muted);font-size:12px}
.pr-ready .pr-gate-main .panel{background:var(--pr-card);color:var(--pr-ink)}
.pr-dialog.ov[open]{display:block;height:fit-content}
.pr-app-bar{background:var(--pr-card);border-bottom:1px solid var(--pr-line)}
.pr-app-bar-inner{max-width:550px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pr-app-brand{display:flex;align-items:center;gap:10px}
.pr-app-brand .pr-logo{width:38px;height:38px;border:1px solid var(--pr-line)}
.pr-app-brand strong{font-size:clamp(13px,4.1vw,17px);white-space:nowrap;display:block;line-height:1.15;letter-spacing:.015em;text-transform:uppercase}
.pr-app-brand strong span{color:var(--pr-green)}
.pr-ready .pr-workspace{width:100%;max-width:550px;margin:0 auto;padding:18px 16px calc(90px + env(safe-area-inset-bottom))}
.pr-workspace h1{font-size:clamp(24px,6vw,32px);line-height:1.15;letter-spacing:-.025em;margin:0}
.pr-workspace p{margin:0}
.pr-page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pr-page-title span,.pr-order-sub{color:var(--pr-muted);font-size:13px}
.pr-workspace .btn,.pr-app-bar .btn,.pr-dialog .btn{min-height:44px;padding:8px 13px;border-radius:11px;font-size:14px;line-height:1.24}
.pr-app-bar .btn.s,.pr-workspace .btn.s,.pr-dialog .btn.s{background:var(--pr-card);color:var(--pr-ink);border:1px solid var(--pr-line)}
.pr-workspace .btn:disabled{opacity:.55;cursor:not-allowed}
.pr-workspace [data-live-info]:empty,.pr-workspace [data-live-load-status]:empty{display:none}
.pr-workspace [data-live-info],.pr-workspace [data-live-load-status]{font-size:13px;color:var(--pr-ink);background:var(--pr-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.pr-rider-shell [hidden],.pr-dialog [hidden]{display:none!important}
.pr-nav{position:fixed;z-index:20;inset:auto 0 0;background:var(--pr-card);border-top:1px solid var(--pr-line);padding:5px 8px calc(5px + env(safe-area-inset-bottom))}
.pr-nav-inner{max-width:550px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pr-nav button{min-height:54px;display:grid;justify-items:center;align-content:center;gap:4px;padding:5px 1px;color:var(--pr-muted);font-size:clamp(10px,2.7vw,13px);font-weight:700;border-radius:12px;line-height:1.2}
.pr-nav button[aria-current=page]{background:var(--pr-soft);color:var(--pr-green)}
.pr-nav .pr-icon{width:22px;height:22px}
.pr-page-title p{margin:4px 0 0;color:var(--pr-muted)}
.pr-trip,.pr-no-deliveries{background:var(--pr-card);border:1px solid var(--pr-line);border-radius:18px;padding:14px}
.pr-payout{display:grid;gap:3px;margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--pr-soft);color:var(--pr-ink)}
.pr-payout span{font-size:12px;color:var(--pr-muted)}
.pr-trip-offer{background:linear-gradient(160deg,var(--pr-soft),var(--pr-card) 52%)}
.pr-trip h2,.pr-no-deliveries h2{margin:0;font-size:23px;line-height:1.25;overflow-wrap:anywhere}
.pr-trip h2.pr-job-alert{font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.pr-trip-header{display:flex;align-items:start;justify-content:space-between;gap:9px;flex-wrap:wrap}
.pr-trip-header p{margin:4px 0 0}
.pr-active-header{align-items:center;margin-bottom:12px}
.pr-active-header h2{font-size:clamp(16px,4.5vw,19px)}
.pr-active-header .pr-step{background:var(--pr-soft)}
.pr-order-items{margin-top:8px;padding:6px 0;color:var(--pr-muted)}
.pr-order-items summary{cursor:pointer;font-weight:700;min-height:35px}
.pr-order-items ul{margin:0;padding-left:22px}
.pr-trip .pr-cod{margin-top:10px}
[data-pr-verification] .btn{margin-top:8px}
.pr-step{font-size:11px;font-weight:750;color:var(--pr-green);border:1px solid var(--pr-line);border-radius:999px;padding:5px 8px;white-space:nowrap}
.pr-availability{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:1px solid var(--pr-line);background:var(--pr-soft);border-radius:999px;font-weight:750;cursor:pointer}
.pr-availability:has(input[hidden]){display:none}
.pr-availability input{appearance:none;width:14px;height:14px;margin:0;border:2px solid var(--pr-muted);border-radius:50%;cursor:pointer}
.pr-availability input:checked{background:var(--pr-green);border-color:var(--pr-green)}
.pr-availability input:disabled{opacity:.5;cursor:wait}
.pr-account-card{background:var(--pr-card);border:1px solid var(--pr-line);border-radius:16px;padding:16px;margin-bottom:14px;overflow-wrap:anywhere}
.pr-account-card h2{margin:0 0 8px;font-size:17px}
.pr-account-card p{color:var(--pr-muted)}
.pr-account-card .btn{justify-content:flex-start}
.pr-account-version{text-align:center;color:var(--pr-muted);font-size:12px}
.pr-form-message{color:var(--pr-muted);margin:8px 0}
.pr-trip-tools{overflow-wrap:anywhere}
.pr-map-canvas{height:clamp(220px,40dvh,360px);background:#e2eee3;border-radius:12px;isolation:isolate}
.pr-map-pin{display:grid;place-items:center;border-radius:50%;border:2px solid white;color:white;font-weight:800;background:#14633e}
.pr-map-drop{background:#a46017}
.pr-map-rider{background:#087f45}
.pr-map-rider svg{width:18px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pr-dialog-body>p.pr-map-disclosure{margin:10px 0 0}
.pr-dialog-body>p.pr-status-note{margin:8px 0}
.pr-earnings-total{padding:14px;background:var(--pr-soft);border-radius:12px}
.pr-earnings-total strong{display:block;font-size:30px}
.pr-earnings-total p{color:var(--pr-muted);font-size:12px}
.pr-history-title{margin-top:14px}
.pr-history-list{list-style:none;margin:0;padding:0}
.pr-history-list li{display:flex;justify-content:space-between;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--pr-line);overflow-wrap:anywhere}
.pr-history-list small{display:block;color:var(--pr-muted)}
.pr-trip-details{background:var(--pr-soft);padding:13px;border-radius:12px;overflow-wrap:anywhere}
.pr-trip-details dt,.pr-trip-label{color:var(--pr-muted);font-size:12px;font-weight:650}
.pr-trip-details dd{font-size:15px;font-weight:750;margin:0}
.pr-trip-details dl,.pr-trip-details ul{margin:0}
.pr-trip-details dl>div+div{margin-top:10px;padding-top:10px;border-top:1px solid var(--pr-line)}
.pr-trip-details .pr-customer-name,.pr-trip-details h3{display:block;margin:2px 0 4px;font-size:17px}
.pr-route-stops>div{padding-left:16px;position:relative}
.pr-route-stops>div:before{content:'';position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:var(--pr-green)}
.pr-route-stops>div+div{margin-top:10px;padding-top:10px;border-top:1px solid var(--pr-line)}
.pr-route-stops>div+div:before{top:17px}
.pr-pickup-slip{border-top:2px dashed var(--pr-line);border-bottom:2px dashed var(--pr-line)}
.pr-recipient{border-top:1px dashed var(--pr-line);padding-top:9px;margin-top:9px}
.pr-pickup-slip ul{list-style:none;padding:9px 0}
.pr-pickup-slip li{display:flex;gap:8px;padding:5px 0}
.pr-pickup-slip li:before{content:'•';color:var(--pr-green)}
.pr-cod{border-top:1px dashed var(--pr-line);padding-top:9px;font-size:15px;font-weight:750}
.pr-workspace .pr-status-note{margin:10px 0 0;color:var(--pr-muted);font-size:13px}
.pr-trip-actions{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.pr-trip-actions.pr-delivery-actions{display:grid}
.pr-trip-actions .btn.p{flex:1;min-height:50px;font-weight:800}
.pr-ready[data-pr-dark=true] .pr-trip-actions .btn.p{background:#34d680;color:#0c2116;box-shadow:0 5px 20px #2fd47625}
.pr-trip-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pr-trip-tools .btn.s{font-size:12px;min-height:44px}
.pr-trip-tools .pr-contact-primary{color:var(--pr-ink);background:var(--pr-card)}
.pr-trip-tools .pr-release{margin-left:auto}
.pr-no-deliveries p{color:var(--pr-muted);font-size:14px;margin-top:6px}
.pr-no-deliveries button{margin-top:10px}
.pr-account-actions{display:grid;gap:8px}
.pr-jobs-nav{display:flex;align-items:center;gap:6px;margin-top:10px}
.pr-jobs-nav button{flex:1}
.pr-jobs-nav span{color:var(--pr-muted);white-space:nowrap}
@media(max-width:700px){.pr-ready .pr-gate-main{margin:5vh auto!important;padding:0 16px 30px!important}}
@media(prefers-reduced-motion:reduce){.pr-ready *{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<!-- PAPALITA RIDER PRESENTATION END -->

<style id="papalita-rider-auth">
.pr-auth-loading{padding:0 25px 25px!important;overflow:hidden;max-width:430px;margin:auto}
.pr-auth-loading .pr-gate-brand{margin-bottom:21px}
.pr-auth-loading p{font-size:13px;color:var(--pr-muted)}

.pr-entry {
  --entry-bg: #fbfaf4;
  --entry-glow: #eaf2e6;
  --entry-ink: #15382b;
  --entry-muted: #4c6559;
  --entry-line: #d8e1d6;
  --entry-accent: #087448;
  --entry-chip: #eaf2e7;
  min-height: 100vh;
  min-height: 100dvh;
  padding-inline: clamp(16px, 5vw, 64px);
  color: var(--entry-ink);
  background: radial-gradient(ellipse at 5% 0%, var(--entry-glow), transparent 58%), var(--entry-bg);
  font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
}
[data-pr-theme="dark"] .pr-entry {
  --entry-bg: #101b16;
  --entry-glow: #20382a;
  --entry-ink: #edf2e8;
  --entry-muted: #b8c9be;
  --entry-line: #375143;
  --entry-accent: #b9e4b7;
  --entry-chip: #22382c;
}
.pr-entry .pr-entry-header, .pr-entry .pr-entry-main {
  width: 100%;
  max-width: 1160px;
  margin-inline: auto;
}
.pr-entry-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 80px;
  border-bottom: 1px solid var(--entry-line);
}
.pr-entry-brand { display: flex; align-items: center; gap: 11px; line-height: 1.2; }
.pr-entry-brand img {
  width: 44px;
  height: 44px;
  padding: 5px;
  border: 1px solid var(--entry-line);
  border-radius: 12px;
  background: #fff;
  object-fit: contain;
}
.pr-entry-brand strong { display: block; font-size: 21px; letter-spacing: -.045em; }
.pr-entry-brand small { display: block; margin-top: 4px; color: var(--entry-muted); font-size: 11px; font-weight: 700; }
.pr-entry-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  color: var(--entry-accent);
  font-size: 13px;
  font-weight: 800;
}
.pr-entry-back:hover { text-decoration: underline; text-underline-offset: 4px; }
.pr-entry .pr-icon { flex: none; }
.pr-entry-back .pr-icon { transform: rotate(180deg); }
.pr-entry .pr-entry-main {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  grid-template-areas: 'intro access';
  align-items: center;
  gap: clamp(28px, 6vw, 80px);
  padding: clamp(36px, 6vw, 76px) 0;
}
.pr-entry-intro { grid-area: intro; }
.pr-entry-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border: 1px solid var(--entry-line);
  border-radius: 999px;
  background: var(--entry-chip);
  color: var(--entry-accent);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.pr-entry-eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pr-ready .pr-entry-intro h2 {
  max-width: 13ch;
  margin: 16px 0;
  color: var(--entry-ink);
  font-size: clamp(42px, 5.6vw, 72px);
  font-weight: 800;
  line-height: 1.04;
  letter-spacing: -.06em;
}
.pr-entry-intro h2 span { color: var(--entry-accent); }
.pr-entry-lead { max-width: 36ch; margin: 0 0 24px; color: var(--entry-muted); font-size: 16px; line-height: 1.65; }
.pr-entry .pr-entry-apply {
  min-height: 50px;
  justify-content: space-between;
  gap: 18px;
  padding-inline: 17px;
  background: #087448;
  color: #fff;
  box-shadow: 0 6px 18px #08744826;
}
.pr-entry .pr-entry-apply:hover { background: #065f3b; }
.pr-entry-note { margin-top: 12px; color: var(--entry-muted); font-size: 13px; }
.pr-entry-access {
  grid-area: access;
  position: relative;
  isolation: isolate;
  min-width: 0;
  overflow: hidden;
  padding: clamp(24px, 3.4vw, 40px);
  border: 1px solid #1b4f3b;
  border-radius: 26px;
  background: linear-gradient(145deg, #103e30, #092b23);
  color: #fff;
  color-scheme: light;
  box-shadow: 0 18px 38px #14362b26;
}
.pr-entry-access-art { position: absolute; z-index: -1; top: -35px; right: -30px; width: 160px; color: #a4ca98; opacity: .22; pointer-events: none; }
.pr-entry-kicker { margin: 0 0 8px; color: #e9cf85; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.pr-ready .pr-entry-access h1 { margin: 0; color: #fff; font-size: clamp(24px, 3vw, 32px); line-height: 1.2; letter-spacing: -.045em; }
.pr-entry-access-copy { margin: 8px 0 22px; color: #d7e9df; font-size: 14px; }
.pr-entry-access .field { margin-bottom: 14px; }
.pr-entry-access .field label { color: #f1f8f3; font-size: 13px; }
.pr-entry .pr-auth-form .in {
  min-height: 49px;
  border-color: #d4e6dc;
  border-radius: 11px;
  background: #f7fbf8;
  color: #173a2c;
  font-size: 16px;
}
.pr-entry .pr-auth-form .in::placeholder { color: #566b5f; }
.pr-entry .pr-auth-form .in:focus { border-color: #a7e2bc; box-shadow: 0 0 0 3px #a7e2bc; }
.pr-entry-access :where(a, button, summary):focus-visible { outline-color: #b9e4b7; }
.pr-password-wrap { position: relative; }
.pr-entry .pr-password-wrap .in { padding-right: 68px; }
.pr-password-toggle {
  position: absolute;
  top: 2px;
  right: 4px;
  bottom: 2px;
  min-width: 50px;
  border-radius: 8px;
  color: #12563c;
  font-size: 12px;
  font-weight: 800;
}
.pr-password-toggle:hover { background: #e1f2df; }
.pr-auth-error { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: #fff1e5; color: #883b24; font-size: 13px; overflow-wrap: anywhere; }
.pr-auth-error:empty { display: none; }
.pr-entry .pr-auth-form > .btn { min-height: 48px; font-weight: 800; }
.pr-entry .pr-entry-signin { justify-content: space-between; background: #e1f2df; color: #163b2b; }
.pr-entry .pr-entry-signin:hover:not(:disabled) { background: #c8e8cd; }
.pr-entry .pr-install-login, .pr-entry .pr-entry-retry {
  margin-top: 8px;
  border: 1px solid #8db5a1;
  background: transparent;
  color: #eaf6ed;
}
.pr-entry .pr-install-login:hover, .pr-entry .pr-entry-retry:hover { background: #ffffff14; }
.pr-auth-form button:disabled { opacity: .65; cursor: wait; }

<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/ops.js"></script><script src="js/rider-road-map.js"></script><script src="js/live-delivery-rider.js?update=delivery-quotes-1"></script>
<script>
(() => { 'use strict';
/* Rider identity is verified by Supabase Auth and the protected user_roles table. */
const { $, esc } = OPS;
let me = null;
let activeRiderId = null;
let stopDeliveries = null;

const prIcons={
 available:'<path d="M4 4h16l2 10v5H2v-5l2-10Zm-2 10h6l2 2h4l2-2h6"/>',
 my:'<path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm-9 5 9 5 9-5m-9 5v8m-4.5-15.5 9 5"/>',
 earnings:'<path d="M3 6h17v13H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Zm17 4h-5a2 2 0 0 0 0 4h5M3 6l13-3 2 3"/>',
 account:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2H4Z"/>',
 install:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/>',arrow:'<path d="M4 12h16M14 6l6 6-6 6"/>',logout:'<path d="M9 3H4v18h5M9 12h12M17 8l4 4-4 4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',moon:'<path d="M20 14a8 8 0 0 1-10-10 8.5 8.5 0 1 0 10 10Z"/>',screen:'<rect x="3" y="3" width="18" height="13" rx="1"/><path d="M12 16v5M7 21h10"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};
const prIcon=name=>`<svg class="pr-icon" viewBox="0 0 24 24" aria-hidden="true">${prIcons[name]}</svg>`;
let prTheme='dark';try{prTheme=localStorage.getItem('papalita.rider.appearance.v1')||'dark';}catch(_){}
const prMedia=window.matchMedia('(prefers-color-scheme: dark)');
function prApplyTheme(){const dark=prTheme==='dark'||prTheme==='system'&&prMedia.matches;document.documentElement.dataset.prTheme=dark?'dark':'light';document.body.classList.add('pr-ready');document.body.dataset.prDark=String(dark);}
prApplyTheme();prMedia.addEventListener?.('change',prApplyTheme);
function prModal(title,content){const previous=document.activeElement,d=document.createElement('dialog');d.className='pr-dialog ov';d.setAttribute('aria-labelledby','pr-dialog-title');d.innerHTML=`<div class="pr-dialog-head"><h2 id="pr-dialog-title">${esc(title)}</h2><button class="pr-icon-button" data-pr-close aria-label="Close dialog">${prIcon('close')}</button></div><div class="pr-dialog-body">${content}</div>`;document.body.append(d);d.querySelector('[data-pr-close]').onclick=()=>d.close();d.addEventListener('close',()=>{d.remove();if(previous?.isConnected)previous.focus();},{once:true});d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});d.showModal();return d;}
document.addEventListener('click',event=>{
 if(!event.target.closest('[data-pr-install]'))return;
 void window.PapalitaRiderInstall?.open(message=>{
  const dialog=prModal('Install Papalita Rider',`<p>${esc(message)}</p><button type="button" class="btn p blk" data-pr-install-done>Got it</button>`);
  dialog.querySelector('[data-pr-install-done]').onclick=()=>dialog.close();
 });
});
function prAppearance(){const d=prModal('Appearance',`<p>Choose how your rider workspace looks on this device.</p><div class="pr-theme-options">${[['light','Light','sun'],['dark','Dark','moon'],['system','System','screen']].map(([key,label,icon])=>`<button type="button" data-pr-theme="${key}" aria-pressed="${prTheme===key}">${prIcon(icon)}${label}</button>`).join('')}</div>`);d.querySelectorAll('[data-pr-theme]').forEach(b=>b.onclick=()=>{prTheme=b.dataset.prTheme;try{localStorage.setItem('papalita.rider.appearance.v1',prTheme);}catch(_){}prApplyTheme();d.querySelectorAll('[data-pr-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});}
function clearDeliveries(){
 const stop=stopDeliveries;
 stopDeliveries=null;
 activeRiderId=null;
 stop?.();
}

function prRenderAccount(){
 if(!me)return;
 const name=$('[data-pr-profile-name]'),email=$('[data-pr-profile-email]'),phone=$('[data-pr-profile-phone]');
 if(!name||!email||!phone)return;
 name.textContent=me.name;
 email.textContent=me.email;
 phone.textContent=me.phone;
 phone.hidden=!me.phone;
}

function prEditProfile(){
 const riderId=me.id;
 const dialog=prModal('Edit Profile',`<form>
  <div class="field"><label for="pr-profile-name">Full name</label><input class="in" id="pr-profile-name" name="name" autocomplete="name" maxlength="100" value="${esc(me.name)}" required></div>
  <div class="field"><label for="pr-profile-phone">Phone number (optional)</label><input class="in" id="pr-profile-phone" name="phone" type="tel" autocomplete="tel" maxlength="25" value="${esc(me.phone)}"></div>
  <p class="pr-form-message" role="status"></p>
  <button class="btn p blk" type="submit">Save Profile</button>
 </form>`);
 const form=dialog.querySelector('form'),button=form.querySelector('button'),status=form.querySelector('[role=status]');
 form.onsubmit=async event=>{
  event.preventDefault();
  if(button.disabled||me?.id!==riderId)return;
  const name=form.elements.name.value.trim(),phone=form.elements.phone.value.trim();
  if(!name){status.textContent='Enter your full name.';return;}
  if(phone&&!/^\+?[0-9]{7,15}$/.test(phone.replace(/[\s()-]/g,''))){
   status.textContent='Enter a valid phone number.';return;
  }
  button.disabled=true;status.textContent='Saving…';
  try{
   const {data,error}=await prGetAuthClient().auth.updateUser({data:{full_name:name,phone}});
   if(error)throw error;
   if(data?.user?.id!==riderId)throw Error('The server could not confirm your profile update.');
   if(me?.id!==riderId)return;
   me={...me,name,phone};
   prRenderAccount();
   $('[data-pr-account-status]').textContent='Profile updated.';
   if(dialog.open)dialog.close();
  }catch(error){if(dialog.open)status.textContent=prAuthMessage(error);}
  finally{button.disabled=false;}
 };
}

function prChangePassword(){
 const riderId=me.id;
 const dialog=prModal('Change Password',`<form>
  <div class="field"><label for="pr-current-password">Current password</label><input class="in" id="pr-current-password" type="password" name="current" autocomplete="current-password" required></div>
  <div class="field"><label for="pr-new-password">New password</label><input class="in" id="pr-new-password" type="password" name="password" autocomplete="new-password" minlength="8" required></div>
  <div class="field"><label for="pr-confirm-password">Confirm new password</label><input class="in" id="pr-confirm-password" type="password" name="confirm" autocomplete="new-password" minlength="8" required></div>
  <div class="field" data-pr-verification hidden>
   <label for="pr-password-code">Verification code</label>
   <input class="in" id="pr-password-code" name="nonce" inputmode="numeric" autocomplete="one-time-code">
   <button class="btn s" type="button" data-pr-send-code>Send verification code</button>
  </div>
  <p class="pr-form-message" role="status"></p>
  <button class="btn p blk" type="submit">Update Password</button>
 </form>`);
 const form=dialog.querySelector('form'),button=form.querySelector('[type=submit]'),status=form.querySelector('[role=status]');
 const verification=form.querySelector('[data-pr-verification]'),send=form.querySelector('[data-pr-send-code]');
 send.onclick=async()=>{
  if(me?.id!==riderId||send.disabled||button.disabled)return;
  send.disabled=true;button.disabled=true;status.textContent='Sending verification code…';
  try{
   const {error}=await prGetAuthClient().auth.reauthenticate();
   if(error)throw error;
   if(dialog.open)status.textContent='Check your email for the verification code.';
  }catch(error){if(dialog.open)status.textContent=prAuthMessage(error);}
  finally{send.disabled=false;button.disabled=false;}
 };
 form.onsubmit=async event=>{
  event.preventDefault();
  if(button.disabled||me?.id!==riderId)return;
  const {current,password,confirm,nonce}=form.elements;
  if(password.value!==confirm.value){status.textContent='The new passwords do not match.';return;}
  if(password.value===current.value){status.textContent='Choose a different password.';return;}
  button.disabled=true;send.disabled=true;status.textContent='Updating password…';
  try{
   const payload={current_password:current.value,password:password.value};
   if(!verification.hidden)payload.nonce=nonce.value.trim();
   const {data,error}=await prGetAuthClient().auth.updateUser(payload);
   if(error)throw error;
   if(data?.user?.id!==riderId)throw Error('The server could not confirm your password update.');
   if(me?.id!==riderId)return;
   form.reset();
   $('[data-pr-account-status]').textContent='Password updated.';
   if(dialog.open)dialog.close();
  }catch(error){
   if(!dialog.open)return;
   if(error?.code==='reauthentication_needed'||/reauthentication required/i.test(error?.message||'')){
    verification.hidden=false;nonce.required=true;
    status.textContent='Send a verification code and enter it to finish changing your password.';
   }else status.textContent=prAuthMessage(error);
  }finally{button.disabled=false;send.disabled=false;}
 };
 dialog.addEventListener('close',()=>form.reset(),{once:true});
}

function draw(){
 if(activeRiderId===me.id){prRenderAccount();return;}
 clearDeliveries();
 const id=me.id;
 const root=$('#root');
 document.title='Papalita Rider';
 root.innerHTML=`
 <div class="pr-rider-shell">
  <header class="pr-app-bar"><div class="pr-app-bar-inner">
   <div class="pr-app-brand">
    <img class="pr-logo" src="images/papalita_mark_color.png" alt="">
    <div><strong>Papalita <span>Rider</span></strong></div>
   </div>
   <label class="pr-availability"><input type="checkbox" aria-label="Available for new deliveries" role="switch" data-rider-availability hidden><span data-rider-availability-label></span></label>

   <section data-rider-account hidden>

    </div>

     <h2>Account Settings</h2>
     <p class="pr-form-message" data-pr-account-status role="status"></p>
     <div class="pr-account-actions">
      <button class="btn s blk" type="button" data-pr-edit-profile>${prIcon('account')}Edit Profile</button>
      <button class="btn s blk" type="button" data-pr-change-password>Change Password</button>
      <button class="btn s blk" type="button" data-pr-show-appearance>${prIcon('sun')}Appearance</button>
      <button class="btn s blk" type="button" data-pr-install>${prIcon('install')}<span class="pr-install-native-label">Install Rider App</span><span class="pr-install-help-label">How to install Rider App</span></button>
      <button class="btn d blk" type="button" data-pr-signout>${prIcon('logout')}Sign out</button>
     </div>
    </div>
    <footer class="pr-account-version">Papalita Rider · Version 1.0</footer>
   </section>
  </main>
  <nav class="pr-nav" aria-label="Rider navigation"><div class="pr-nav-inner">
   ${[['available','Available'],['my','My Deliveries'],['earnings','Earnings'],['account','Account']].map(([key,label])=>
    `<button type="button" data-delivery-action="${key}"${key==='available'?' aria-current="page"':''}>${prIcon(key)}<span>${label}</span></button>`).join('')}
  </div></nav>
 </div>`;
 prRenderAccount();
 root.querySelector('[data-pr-edit-profile]').onclick=prEditProfile;
 root.querySelector('[data-pr-change-password]').onclick=prChangePassword;
 root.querySelector('[data-pr-signout]').onclick=()=>void prRiderSignOut();
 root.querySelector('[data-pr-show-appearance]').onclick=prAppearance;
 if(!window.PapalitaLiveRider?.mount){
  root.querySelector('[data-live-load-status]').textContent='Could not open your deliveries. Tap Refresh to try again.';
  root.querySelector('[data-live-refresh]').onclick=()=>location.reload();
  return;
 }
 stopDeliveries=window.PapalitaLiveRider.mount(root,prGetAuthClient(),()=>me?.id===id,esc,prModal);
 activeRiderId=id;
}

/* PAPALITA SUPABASE RIDER AUTH */
let prAuthClient=null,prAuthGeneration=0,prAuthBusy=false,prSigningIn=false,prSigningOut=false,prAuthScheduled=false,prAuthCheckedAt=0,prLoginEmail='',prSignOutFailed=false;
function prGetAuthClient(){
 if(prAuthClient?.auth)return prAuthClient;
 if(window.PAPALITA_DB?.auth){prAuthClient=window.PAPALITA_DB;return prAuthClient;}
 const config=window.FOODIE_CONFIG?.supabase;
 if(!config?.url||!config?.anonKey)throw Error('Supabase is not configured. Check the public URL and publishable key in js/config.js.');
 if(!window.supabase?.createClient)throw Error('The Supabase sign-in library could not load. Check your internet connection and refresh.');
 prAuthClient=window.supabase.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 window.PAPALITA_DB=prAuthClient;return prAuthClient;
}
function prDropLegacyLogin(){try{sessionStorage.removeItem('foodie.rider');}catch(_){} }
function prCloseAuthDialogs(){document.querySelectorAll('dialog.pr-dialog').forEach(dialog=>{if(dialog.open)dialog.close();dialog.remove();});}
function prAuthMessage(error){
 if(error?.code==='invalid_credentials'||/invalid login credentials/i.test(error?.message||''))return 'Incorrect email or password. Please try again.';
 if(error?.code==='email_not_confirmed')return 'Please confirm your email address before signing in.';
 return error?.message||'Could not sign in. Please try again.';
}
async function prAuthorizeRider(client,user){
 if(!user?.id)throw Error('Your session could not be verified. Please sign in again.');
 const result=await client.from('user_roles').select('user_id,role').eq('user_id',user.id);
 if(result.error)throw Error('Unable to verify rider access: '+result.error.message+' Ask your administrator to check read access to your own user_roles row.');
 const rider=(result.data||[]).some(row=>row.user_id===user.id&&String(row.role||'').trim().toLowerCase()==='rider');
 if(!rider){const error=Error('This account has no rider access. Ask your Papalita administrator to assign the rider role.');error.code='RIDER_ROLE_REQUIRED';throw error;}
 // Profiles provide display details only. A profile field cannot grant rider access.
 let profile={};try{const q=await client.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!q.error&&q.data)profile=q.data;}catch(_){}
 const metadata=user.user_metadata||{};
 return {
  id:user.id,
  name:String(metadata.full_name||profile.full_name||profile.name||String(user.email||'').split('@')[0]||'Rider'),
  email:String(user.email||''),
  phone:String(metadata.phone??profile.phone??'')
 };
}
async function prVerifiedIdentity(client){
 const result=await client.auth.getUser();if(result.error)throw result.error;
 return prAuthorizeRider(client,result.data?.user);
}
async function prRiderCredentials(email,password){
 const client=prGetAuthClient(),result=await client.auth.signInWithPassword({email,password});
 if(result.error)throw result.error;
 if(!result.data?.user||!result.data?.session)throw Error('Sign-in did not return a valid session. Please try again.');
 return prVerifiedIdentity(client);
}
function prAuthLoading(message='Checking your rider account…'){
 clearDeliveries();
 document.title='Papalita Rider · Checking account';
 $('#root').innerHTML=`<main class="pr-gate-main"><section class="panel pr-auth-loading" role="status"><div class="pr-gate-brand"><img class="pr-logo" src="images/papalita_mark_color.png" alt="Papalita"><div><strong>Papalita</strong><small>Rider portal</small></div></div><p>${esc(message)}</p></section></main>`;
}
function prRiderGate(message=''){
 clearDeliveries();
 document.title='Papalita Rider · Sign in';
 $('#root').innerHTML=`
  <div class="pr-entry">
    <header class="pr-entry-header">
      <div class="pr-entry-brand">
        <img src="images/papalita_mark_color.png" alt="" width="44" height="44">
        <div><strong>Papalita</strong><small>Rider Portal</small></div>
      </div>
      <a class="pr-entry-back" href="https://tomcaberio99-design.github.io/papalita/">${prIcon('arrow')} Customer app</a>
    </header>
    <main class="pr-entry-main">
      <section class="pr-entry-access" aria-labelledby="rider-signin-title">
        <svg class="pr-entry-access-art" viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
          <circle cx="107" cy="53" r="48"/><circle cx="107" cy="53" r="64"/><circle cx="107" cy="53" r="80"/>
          <path d="M56 131c5-29 32-33 44-54 7-12 8-28 8-38m-6 6 6-6 6 6"/>
        </svg>
        <p class="pr-entry-kicker">Already a rider?</p>
        <h1 id="rider-signin-title">Sign in as a rider</h1>
        <p class="pr-entry-access-copy">Use the email and password you registered with.</p>
        <form id="g" class="pr-auth-form">
          <div class="field">
            <label for="rider-email">Email address</label>
            <input class="in" id="rider-email" name="email" type="email" autocomplete="username" inputmode="email" value="${esc(prLoginEmail)}" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="rider-password">Password</label>
            <div class="pr-password-wrap">
              <input class="in" id="rider-password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
              <button type="button" class="pr-password-toggle" id="rider-password-toggle" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </div>
          <p class="err pr-auth-error" id="pe" role="alert">${esc(message)}</p>
          <button class="btn blk pr-entry-signin" id="rider-signin" type="submit">Sign in ${prIcon('arrow')}</button>
          <button type="button" class="btn blk pr-install-login" data-pr-install>
            ${prIcon('install')}<span class="pr-install-native-label">Install Rider App</span><span class="pr-install-help-label">How to install Rider App</span>
          </button>
          <p class="pr-install-pending" role="status">Install Rider App will appear when Chrome is ready.</p>
        </form>
        <p class="pr-auth-access">Your account needs the <b>rider</b> role. Contact your Papalita administrator if you need access.</p>
      </section>
      <section class="pr-entry-intro" aria-labelledby="rider-entry-title">
        <span class="pr-entry-eyebrow">For riders in Alegria</span>
        <h2 id="rider-entry-title">Deliver with <span>Papalita.</span></h2>
        <p class="pr-entry-lead">Pick up orders from local stores and deliver them to customers around Alegria.</p>
        <a class="btn pr-entry-apply" href="https://papalitaoriginal.netlify.app/apply/?role=rider">Apply as a Rider ${prIcon('arrow')}</a>
        <p class="pr-entry-note">We review each application before rider access is granted.</p>
      </section>
    </main>
  </div>`;
 const form=$('#g'),password=$('#rider-password'),toggle=$('#rider-password-toggle');
 if(prSignOutFailed){const retry=document.createElement('button');retry.type='button';retry.className='btn blk pr-entry-retry';retry.textContent='Retry sign out';retry.onclick=()=>void prRiderSignOut();$('#rider-signin').after(retry);}
 toggle.onclick=()=>{const shown=password.type==='password';password.type=shown?'text':'password';toggle.textContent=shown?'Hide':'Show';toggle.setAttribute('aria-label',shown?'Hide password':'Show password');toggle.setAttribute('aria-pressed',String(shown));};
 form.onsubmit=event=>{event.preventDefault();void prRiderSubmit(form);};
}
async function prRiderSubmit(form){
 if(prSigningIn||prSigningOut)return;
 const email=form.querySelector('#rider-email').value.trim(),passwordInput=form.querySelector('#rider-password'),password=passwordInput.value,button=form.querySelector('#rider-signin'),error=form.querySelector('#pe');
 if(!email||!password){error.textContent='Enter your email address and password.';return;}
 prLoginEmail=email;prSigningIn=true;prAuthBusy=true;me=null;const generation=++prAuthGeneration;
 error.textContent='';button.disabled=true;button.textContent='Signing in…';form.setAttribute('aria-busy','true');
 try{const identity=await prRiderCredentials(email,password);if(generation!==prAuthGeneration)return;me=identity;prSignOutFailed=false;prAuthCheckedAt=Date.now();prAuthBusy=false;draw();}
 catch(e){if(generation===prAuthGeneration){me=null;error.textContent=prAuthMessage(e);}}
 finally{passwordInput.value='';prSigningIn=false;if(generation===prAuthGeneration)prAuthBusy=false;if(form.isConnected){button.disabled=false;button.innerHTML='Sign in '+prIcon('arrow');form.removeAttribute('aria-busy');}}
}
function prLockRider(message=''){
 ++prAuthGeneration;me=null;prAuthBusy=false;prDropLegacyLogin();prCloseAuthDialogs();prRiderGate(message);
}
async function prHydrateRider(){
 if(prAuthBusy||prSigningOut||prSigningIn)return;
 const generation=++prAuthGeneration;prAuthBusy=true;
 if(!me)prAuthLoading();
 try{
  const client=prGetAuthClient(),session=await client.auth.getSession();if(session.error)throw session.error;
  if(generation!==prAuthGeneration)return;
  if(!session.data?.session){me=null;prCloseAuthDialogs();prRiderGate();return;}
  if(me&&me.id!==session.data.session.user?.id){me=null;prCloseAuthDialogs();prAuthLoading();}
  const identity=await prVerifiedIdentity(client);if(generation!==prAuthGeneration)return;
  me=identity;prAuthCheckedAt=Date.now();prAuthBusy=false;draw();
 }catch(error){if(generation===prAuthGeneration){me=null;prCloseAuthDialogs();prRiderGate(prAuthMessage(error));}}
 finally{if(generation===prAuthGeneration)prAuthBusy=false;}
}
function prScheduleAuthCheck(){
 if(prAuthScheduled||prAuthBusy||prSigningIn||prSigningOut||prSignOutFailed)return;
 prAuthScheduled=true;setTimeout(()=>{prAuthScheduled=false;void prHydrateRider();},0);
}
async function prRiderSignOut(){
 if(prSigningOut)return;
 prSigningOut=true;prSignOutFailed=false;++prAuthGeneration;me=null;prAuthBusy=true;prCloseAuthDialogs();prDropLegacyLogin();prAuthLoading('Signing out…');
 try{const result=await prGetAuthClient().auth.signOut({scope:'local'});if(result.error)throw result.error;prRiderGate();}
 catch(error){prSignOutFailed=true;prRiderGate('Sign-out could not be completed: '+prAuthMessage(error)+' Please try again.');}
 finally{me=null;prSigningOut=false;prAuthBusy=false;}
}
async function prRiderBoot(){
 me=null;prDropLegacyLogin();prAuthLoading();
 try{
  const client=prGetAuthClient();
  client.auth.onAuthStateChange((event,session)=>{
   // Keep this callback synchronous; all network work is deferred outside it.
   if(event==='SIGNED_OUT'){prLockRider();return;}
   if(event==='SIGNED_IN'||event==='USER_UPDATED'||event==='TOKEN_REFRESHED'){
    if(!prSigningIn&&(!me||me.id!==session?.user?.id||event==='USER_UPDATED'||Date.now()-prAuthCheckedAt>60000))prScheduleAuthCheck();
   }
  });
  await prHydrateRider();
 }catch(error){me=null;prAuthBusy=false;prRiderGate(prAuthMessage(error));}
}

void prRiderBoot();
})();
